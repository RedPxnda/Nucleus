dependencies {
    api(include("io.github.spair:imgui-java-binding:$imgui_version"))
    api(include("io.github.spair:imgui-java-lwjgl3:$imgui_version")) {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    }

    runtimeOnly(api(include("io.github.spair:imgui-java-natives-linux:$imgui_version")))
    runtimeOnly(api(include("io.github.spair:imgui-java-natives-macos:$imgui_version")))
    runtimeOnly(api(include("io.github.spair:imgui-java-natives-windows:$imgui_version")))
}